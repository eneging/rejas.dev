name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Pint, build y pruebas

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Formato (Pint)
        run: vendor/bin/pint --test

      - name: Assets
        run: npm run build

      - name: Pruebas
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
