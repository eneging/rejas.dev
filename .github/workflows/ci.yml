name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Pruebas (${{ matrix.db }})

    strategy:
      fail-fast: false
      matrix:
        db: [mysql, sqlite]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rejas_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Formato (Pint)
        run: vendor/bin/pint --test

      - name: Assets
        run: npm run build

      - name: Pruebas
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'rejas_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
